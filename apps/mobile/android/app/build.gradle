apply plugin: 'com.android.application'

def getAppVersionDetails = { ->
    // Read from apps/mobile/package.json as the single authoritative source of truth for the mobile app
    def versionPropsFile = rootProject.file('../package.json')
    def versionName = "1.0"
    if (versionPropsFile.exists()) {
        def match = versionPropsFile.text =~ /"version"\s*:\s*"([^"]+)"/
        if (match) {
            versionName = match[0][1]
        }
    }
    if (project.hasProperty('versionName')) {
        versionName = project.property('versionName').toString()
    }

    // Version code: calculate monotonically from major.minor (e.g. 1.0 -> 100, 1.1 -> 101, 1.2 -> 102, 1.99 -> 199, 2.0 -> 200)
    def parts = versionName.tokenize('.')
    def major = parts.size() > 0 ? parts[0].toInteger() : 1
    def minor = parts.size() > 1 ? parts[1].toInteger() : 0
    def defaultCode = (major * 100) + minor

    def versionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : defaultCode
    return [code: versionCode, name: versionName]
}

def appVersion = getAppVersionDetails()

android {
    namespace "com.securesave.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.securesave.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.code
        versionName appVersion.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Check for keystore file at specified path, falling back to standard release keystore names
            def customKeystorePath = System.getenv("KEYSTORE_FILE") ?: (project.hasProperty('KEYSTORE_FILE') ? project.property('KEYSTORE_FILE') : null)
            def keystoreFile = customKeystorePath ? file(customKeystorePath) : (file('../securesave-release.keystore').exists() ? file('../securesave-release.keystore') : file('../release-key.jks'))

            if (!keystoreFile.exists()) {
                throw new GradleException("Release build failed: Release keystore file not found at " + keystoreFile.absolutePath)
            }

            def kPass = System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty('KEYSTORE_PASSWORD') ? project.property('KEYSTORE_PASSWORD') : null)
            def kAlias = System.getenv("KEY_ALIAS") ?: (project.hasProperty('KEY_ALIAS') ? project.property('KEY_ALIAS') : null)
            def kKeyPass = System.getenv("KEY_PASSWORD") ?: (project.hasProperty('KEY_PASSWORD') ? project.property('KEY_PASSWORD') : null)

            if (!kPass || !kAlias || !kKeyPass) {
                throw new GradleException("Release build failed: Missing required signing credentials (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).")
            }

            storeFile keystoreFile
            storePassword kPass
            keyAlias kAlias
            keyPassword kKeyPass
        }
    }

    buildTypes {
        debug {
            // Debug builds use default signing
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
