name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm run build --workspace=@secure-save/shared-types || true

      - name: Build Mobile Web App
        run: |
          cd apps/mobile
          npm install
          npm run build

      - name: Add and Sync Capacitor Android
        run: |
          cd apps/mobile
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureSave-Debug-APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
