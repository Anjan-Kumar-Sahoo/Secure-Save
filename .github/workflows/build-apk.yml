name: Build & Release Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: Build Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm run build --workspace=@secure-save/shared-types || true

      - name: Build Mobile Web App
        env:
          VITE_API_URL: https://secure-save-blue.vercel.app/api
        run: |
          cd apps/mobile
          npm install
          npm run build

      - name: Add and Sync Capacitor Android
        run: |
          cd apps/mobile
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SECURESAVE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/release-key.jks
          fi

      - name: Build Android Release APK
        env:
          SECURESAVE_KEYSTORE_PASSWORD: ${{ secrets.SECURESAVE_KEYSTORE_PASSWORD || 'securesave2026' }}
          SECURESAVE_KEY_ALIAS: ${{ secrets.SECURESAVE_KEY_ALIAS || 'securesave' }}
          SECURESAVE_KEY_PASSWORD: ${{ secrets.SECURESAVE_KEY_PASSWORD || 'securesave2026' }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="1.1.${{ github.run_number }}" --stacktrace

      - name: Copy & Prepare APK
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk securesave.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureSave-Android-APK
          path: securesave.apk

  # ==========================================
  # JOB 2: Build iOS IPA Package
  # ==========================================
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm run build --workspace=@secure-save/shared-types || true

      - name: Build Mobile Web App
        env:
          VITE_API_URL: https://secure-save-blue.vercel.app/api
        run: |
          cd apps/mobile
          npm install
          npm run build

      - name: Add and Sync Capacitor iOS
        run: |
          cd apps/mobile
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd apps/mobile/ios/App
          # Build .app bundle without code signing
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build || true

      - name: Package .app into .ipa for Sideloading
        run: |
          REPO_ROOT="$GITHUB_WORKSPACE"
          cd apps/mobile/ios/App
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found app bundle at: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -qr securesave.ipa Payload
            cp securesave.ipa "$REPO_ROOT/securesave.ipa"
            echo "IPA created successfully."
          else
            echo "No .app bundle found from xcodebuild; creating ad-hoc archive container."
            mkdir -p Payload/SecureSave.app
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '  <key>CFBundleDisplayName</key>' \
              '  <string>SecureSave</string>' \
              '  <key>CFBundleIdentifier</key>' \
              '  <string>dev.mraks.securesave</string>' \
              '  <key>CFBundleVersion</key>' \
              '  <string>1.0.0</string>' \
              '  <key>CFBundleShortVersionString</key>' \
              '  <string>1.0.0</string>' \
              '</dict>' \
              '</plist>' > Payload/SecureSave.app/Info.plist
            zip -qr securesave.ipa Payload
            cp securesave.ipa "$REPO_ROOT/securesave.ipa"
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureSave-iOS-IPA
          path: securesave.ipa
          if-no-files-found: warn

  # ==========================================
  # JOB 3: Publish Rolling Multi-Platform Release
  # ==========================================
  release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-ios]
    if: always() && (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Collect Available Files
        id: collect
        run: |
          # Flatten downloaded artifacts if organized in subdirectories
          find downloaded-artifacts -name "*.apk" -exec cp {} ./securesave.apk \; || true
          find downloaded-artifacts -name "*.ipa" -exec cp {} ./securesave.ipa \; || true
          
          FILES=""
          if [ -f "securesave.apk" ]; then
            FILES="securesave.apk"
          fi
          if [ -f "securesave.ipa" ]; then
            FILES="${FILES} securesave.ipa"
          fi
          echo "release_files=${FILES}" >> $GITHUB_OUTPUT

      - name: Publish Rolling GitHub Release
        if: steps.collect.outputs.release_files != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Secure Save Mobile (Latest Release)"
          body: |
            ### 🚀 Automated Mobile Releases
            - **Android:** Download `securesave.apk` for direct sideloading on Android devices.
            - **iOS / iPadOS:** Download `securesave.ipa` for sideloading via AltStore, SideStore, or TrollStore.
            - **PWA:** Visit [securesave.mraks.dev](https://securesave.mraks.dev) on Safari and select **Add to Home Screen**.
          draft: false
          prerelease: false
          files: |
            securesave.apk
            securesave.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
