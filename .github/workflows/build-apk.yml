name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: Check Version & Avoid Duplicate Releases
  # ==========================================
  check-version:
    name: Check Version & Duplicate Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver_check.outputs.should_release }}
      app_version: ${{ steps.ver_check.outputs.app_version }}
      version_code: ${{ steps.ver_check.outputs.version_code }}
      release_tag: ${{ steps.ver_check.outputs.release_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine App Version
        id: ver_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read app version from single source of truth (apps/mobile/package.json)
          APP_VER=$(node -p "require('./apps/mobile/package.json').version.trim()")
          echo "Current app version in code: ${APP_VER}"
          
          # Calculate monotonic Android versionCode: major * 100 + minor
          # e.g., 1.0 -> 100, 1.1 -> 101, 1.2 -> 102, 1.99 -> 199, 2.0 -> 200
          IFS='.' read -r MAJOR MINOR EXTRA <<< "${APP_VER}"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          VERSION_CODE=$(( (MAJOR * 100) + MINOR ))
          
          RELEASE_TAG="v${APP_VER}"
          echo "Target Release Tag: ${RELEASE_TAG}"
          echo "Target Version Code: ${VERSION_CODE}"
          
          # Check if a GitHub release or tag already exists for this exact version
          TAG_EXISTS=false
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists on GitHub."
            TAG_EXISTS=true
          elif git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q "${RELEASE_TAG}"; then
            echo "Git tag ${RELEASE_TAG} already exists on remote repository."
            TAG_EXISTS=true
          fi
          
          if [ "$TAG_EXISTS" = "true" ]; then
            echo "Skipping release publication: version ${APP_VER} (${RELEASE_TAG}) is already published."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected. Proceeding to build and publish ${RELEASE_TAG}."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
          
          echo "app_version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

  # ==========================================
  # JOB 2: Build Android Release APK
  # ==========================================
  build-android:
    name: Build Android Release APK
    needs: [check-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Required Keystore Secrets
        run: |
          MISSING=()
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            MISSING+=("KEYSTORE_PASSWORD")
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            MISSING+=("KEY_ALIAS")
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            MISSING+=("KEY_PASSWORD")
          fi
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            MISSING+=("KEYSTORE_BASE64")
          fi
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Build failed: Missing required GitHub Actions Secret(s): ${MISSING[*]}."
            echo "Please configure them under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Restore Keystore File from Secret
        env:
          KEYSTORE_BASE64_DATA: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64_DATA" | base64 --decode > apps/mobile/android/securesave-release.keystore
          if [ ! -f "apps/mobile/android/securesave-release.keystore" ]; then
            echo "::error::Failed to decode and restore apps/mobile/android/securesave-release.keystore!"
            exit 1
          fi

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm run build --workspace=@secure-save/shared-types || true

      - name: Build Mobile Web App
        env:
          VITE_API_URL: https://secure-save-blue.vercel.app/api
        run: |
          npm run build --workspace=@secure-save/mobile

      - name: Sync Capacitor Android
        run: |
          cd apps/mobile
          npx cap sync android

      - name: Compile and Sign Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APP_VER="${{ needs.check-version.outputs.app_version }}"
          VER_CODE="${{ needs.check-version.outputs.version_code }}"
          echo "Building signed release APK for version: ${APP_VER} (code: ${VER_CODE})"
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode="${VER_CODE}" -PversionName="${APP_VER}" --stacktrace

      - name: Prepare APK Output
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk securesave.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureSave-Android-APK
          path: securesave.apk

  # ==========================================
  # JOB 3: Publish GitHub Release
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [check-version, build-android]
    if: needs.check-version.outputs.should_release == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: SecureSave-Android-APK

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.release_tag }}
          name: "Secure Save v${{ needs.check-version.outputs.app_version }}"
          body: |
            ### 🚀 Secure Save Mobile `v${{ needs.check-version.outputs.app_version }}`
            - **Android:** Download `securesave.apk` for direct sideloading and update.
            - **PWA:** Visit [securesave.mraks.dev](https://securesave.mraks.dev) on Safari and select **Add to Home Screen**.
          draft: false
          prerelease: false
          make_latest: true
          files: securesave.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
